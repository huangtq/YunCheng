<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		  <meta name="renderer" content="webkit">
		<meta name="description" content="会议详情与报名入口，欢迎转发分享。">
		<meta property="og:type" content="website">
		<meta property="og:title" content="会议邀请">
		<meta property="og:description" content="会议详情与报名入口，欢迎转发分享。">
		<title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="shortcut icon" type="image/x-icon" href="<%= BASE_URL %>static/favicon.ico">
		<script>
			// 旧 hash 路由兼容：/h5/#/pages/... -> /h5/pages/...
			(function () {
				try {
					var hash = location.hash || ''
					if (hash.indexOf('#/') !== 0) return
					var route = hash.slice(1)
					var pathname = (location.pathname || '/h5/').replace(/\/index\.html$/i, '')
					var base = '/h5'
					var idx = pathname.indexOf('/h5')
					if (idx >= 0) base = pathname.slice(0, idx + 3)
					base = base.replace(/\/$/, '')
					location.replace(location.origin + base + route)
				} catch (e) {}
			})()
		</script>
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
			document.write('<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' + (coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<link rel="stylesheet" href="<%= BASE_URL %>static/index.<%= VUE_APP_INDEX_CSS_HASH %>.css" />
	</head>
	<body>
		<noscript>
			<strong>本站点必须要开启JavaScript才能运行.</strong>
		</noscript>
		<div id="app"></div>
</html>
