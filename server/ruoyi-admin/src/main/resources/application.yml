# 项目相关配置
ruoyi:
  # 名称
  name: YunCheng
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径，可通过 YUNCHENG_PROFILE_PATH 覆盖
  profile: ${YUNCHENG_PROFILE_PATH:${user.home}/yuncheng/uploadPath}
  # Test resources can be mirrored to a separate server directory. Enable only in application-local.yml.
  test-resource:
    enabled: false
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # 本机密码放在未纳入 Git 的 application-local.yml
    active: druid,local
  # 文件上传
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      # 通过 SSH 隧道连接远端 Redis
      host: 127.0.0.1
      # 本机 Redis 隧道端口
      port: 16379
      # 数据库索引
      database: 0
      # 密码
      password: ${RUOYI_REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（4小时）
  expireTime: 240

# 微信服务号（H5门户）
wechat:
  mp:
    app-id: ${WECHAT_MP_APP_ID:}
    app-secret: ${WECHAT_MP_SECRET:}
    # 微信授权回调到后端的地址，需在公众号后台配置为同一域名
    oauth-redirect-uri: ${WECHAT_MP_OAUTH_REDIRECT:}
    # H5会议首页模板，{activityId} 会被替换；本地可设 WECHAT_MP_H5_HOME=http://localhost:9090/h5/pages/meeting/home?activityId={activityId}
    h5-home-url: ${WECHAT_MP_H5_HOME:https://yunchengmice.cn/h5/pages/meeting/home?activityId={activityId}}
    # 对外可访问的 API 根地址（封面绝对路径）
    public-base-url: ${WECHAT_MP_PUBLIC_BASE:https://yunchengmice.cn/prod-api}
    # 对外分享落地页（微信转发请用这个，不要用 SPA 页面地址）
    share-page-url: ${WECHAT_MP_SHARE_PAGE:https://yunchengmice.cn/h5/share?activityId={activityId}}
    # 本地调试无公网时可开启 mock 授权；正式环境设 WECHAT_MP_MOCK_ENABLED=false
    mock-enabled: ${WECHAT_MP_MOCK_ENABLED:true}
    token-expire-minutes: 10080

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,yunchengmice.cn,www.yunchengmice.cn

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*
